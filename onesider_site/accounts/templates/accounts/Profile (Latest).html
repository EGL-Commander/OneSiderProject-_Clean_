{% extends 'base.html' %}

{% block title %}Profile — OneSider{% endblock %}

{% block content %}

<section class="py-20" style="padding-top: calc(var(--nav-height) + 80px);">

    <div class="max-w-7xl mx-auto px-6 md:px-8">

        <!-- Header -->
        <div class="flex items-center gap-6 mb-12">
            <h2 class="text-xs uppercase tracking-[0.3em] font-medium"
                style="color: var(--text-bright);">
                Profile
            </h2>

            <div class="h-[1px] flex-1"
                style="background: var(--border);">
            </div>
        </div>

        <!-- Profile Card -->
        <div class="card-container p-8 md:p-10 mb-12">

            <div class="flex flex-col md:flex-row items-center md:items-start gap-8">

                <!-- Avatar -->
                <div
                    class="w-28 h-28 rounded-full border flex items-center justify-center flex-shrink-0"
                    style="
                        border-color: var(--accent);
                        color: var(--text-bright);
                        background: var(--bg-deep);
                    "
                >
                    <span class="text-xl tracking-widest font-medium">
                        OS{{ profile.avatar }}
                    </span>
                </div>

                <!-- Info -->
                <div class="flex-1 text-center md:text-left">

                    <h1 class="text-2xl md:text-3xl mb-2"
                        style="color: var(--text-bright);">
                        {{ profile.display_name }}
                    </h1>

                    <p class="text-sm tracking-widest uppercase mb-6"
                        style="color: var(--text-main);">
                        @{{ request.user.username }}
                    </p>

                    <a href="{% url 'profile_edit' %}"
                       class="btn-premium inline-block px-6 py-3 text-xs tracking-widest uppercase">
                        Edit Profile
                    </a>

                </div>

            </div>

        </div>

        <a href="{% url 'library' %}"
        class="btn-premium inline-block px-6 py-3 text-xs tracking-widest uppercase">
            Open Archive
        </a>

    </div>

</section>

{% endblock %}

{% block scripts %}
<script>
    applyImageFadeIn();
</script>
{% endblock %}
