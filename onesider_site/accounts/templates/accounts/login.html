{% extends 'base.html' %}

{% block title %}Login - OneSider {% endblock %}

{% block content %}

<h2>Login</h2>

{% if form.errors %}
  <p style="color:red;">Invalid username or password.</p>
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Login</button>
    {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
    {% endif %}
</form>

{% endblock %}
